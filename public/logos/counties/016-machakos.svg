  <circle cx="100" cy="100" r="95" fill="#ffffff" stroke="#e2e8f0" stroke-width="2" filter="url(#f-016)" />
  <circle cx="100" cy="100" r="88" fill="none" stroke="#bb0000" stroke-width="2.5" />
