    <ellipse cx="0" cy="10" rx="18" ry="10" fill="#d97706"/><circle cx="16" cy="0" r="5" fill="#d97706"/><path d="M0,0 Q5,-10 10,0" fill="#b45309"/><circle cx="-15" cy="-15" r="8" fill="#fde047"/>
