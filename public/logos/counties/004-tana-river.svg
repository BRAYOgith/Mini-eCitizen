  <text x="100" y="170" font-family="'Lexend', 'Segoe UI', sans-serif" font-size="5.5" font-weight="500" fill="#e2e8f0" text-anchor="middle" letter-spacing="0.2">COAST REGION • REPUBLIC OF KENYA</text>
