    <path d="M-30,10 Q-10,-5 10,15 Q25,5 35,20" stroke="#bae6fd" stroke-width="4" fill="none"/><circle cx="0" cy="-10" r="14" fill="#fbbf24"/><path d="M-20,25 L20,25" stroke="#ffffff" stroke-width="2"/>
